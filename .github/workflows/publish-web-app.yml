name: Publish Paisa web app

# Pages serves the gh-pages branch, so this keeps that branch in step with
# finance-tracker/ on main. Nothing to switch on in repository settings.

on:
  push:
    branches: [main]
    paths:
      - 'finance-tracker/**'
      - '.github/workflows/publish-web-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web-app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the app files are present
        run: |
          test -f finance-tracker/index.html
          test -f finance-tracker/sw.js
          test -f finance-tracker/manifest.webmanifest

      - name: Publish finance-tracker/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r finance-tracker/. "$site"/

          # Developer-only files have no business on the live site.
          rm -rf "$site/docs" "$site/tools" "$site/tests" "$site/README.md"

          # Stops Jekyll from reprocessing the files on the way out.
          touch "$site/.nojekyll"

          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
