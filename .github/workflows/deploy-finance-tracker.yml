name: Deploy Paisa to GitHub Pages

# Publishes finance-tracker/ so the app can be installed on a phone.
# Pages is enabled by the workflow itself on the first run.

on:
  push:
    branches: [main]
    paths: ['finance-tracker/**', '.github/workflows/deploy-finance-tracker.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the app files are present
        run: |
          test -f finance-tracker/index.html
          test -f finance-tracker/sw.js
          test -f finance-tracker/manifest.webmanifest

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo if it is not already, so no manual
        # Settings change is needed before the first deploy.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: finance-tracker

      - id: deployment
        uses: actions/deploy-pages@v4
