name: Build Android APK

# Builds a debug APK you can download and sideload. The runner supplies the
# Android SDK, which is why this happens here rather than on a laptop.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paisa-android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The calculation module has no Android dependencies, so it is checked
      # first: a failure here is a real logic problem, not a build-setup one.
      - name: Test the core logic
        working-directory: paisa-android/core
        run: ./gradlew test --no-daemon

      - name: Build the debug APK
        working-directory: paisa-android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      # Gradle's stack trace buries the compiler output, so the errors are
      # repeated here at the end of the log where they can actually be read.
      - name: Show what went wrong
        if: failure()
        run: |
          echo "--------------- KOTLIN COMPILER ERRORS ---------------"
          grep -E "^e: " /tmp/build.log | head -60 || true
          echo "--------------- FAILING TASK -------------------------"
          grep -E "^> Task .*FAILED|Execution failed for task" /tmp/build.log | head -10 || true
          echo "--------------- GRADLE FAILURE BLOCK -----------------"
          sed -n '/^FAILURE: Build failed/,$p' /tmp/build.log | head -60 || true
          echo "--------------- LAST OUTPUT BEFORE FAILURE -----------"
          grep -vE "^\s+at |^\s*\.\.\. " /tmp/build.log | tail -40 || true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: paisa-debug-apk
          path: paisa-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            paisa-android/core/build/reports/
            paisa-android/app/build/reports/
          if-no-files-found: ignore
